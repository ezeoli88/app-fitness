name: backup

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: worker
      - name: Exportar D1
        working-directory: worker
        run: npx wrangler d1 export rutina-db --remote --output ../rutina-backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: rutina-d1-backup
          path: rutina-backup.sql
          retention-days: 30
