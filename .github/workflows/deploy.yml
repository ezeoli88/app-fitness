name: deploy

on:
  push:
    branches: [main]

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Access tiene que estar configurado
        working-directory: worker
        run: |
          if grep -q 'pending-access-aud' wrangler.toml || grep -q 'pending.cloudflareaccess.com' wrangler.toml; then
            echo 'ACCESS_TEAM_DOMAIN y ACCESS_AUD siguen en placeholder. No se publica.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - name: Migrar la D1
        working-directory: worker
        run: npx wrangler d1 migrations apply rutina-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - name: Publicar
        id: deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comprobar Access y volver atrás si falla
        working-directory: worker
        run: node ../scripts/access-smoke.mjs || (npx wrangler rollback --message "El chequeo de Access falló" && exit 1)
        env:
          APP_URL: https://rutina.ekiolivier.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
