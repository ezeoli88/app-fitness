name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --pretty false
      - run: npm run export:web
      - run: node scripts/check-web-bundle.mjs
      - name: El worker de producción no puede saltarse Access
        run: |
          if grep -q 'DEV_BYPASS_ACCESS' worker/wrangler.toml; then
            echo 'wrangler.toml no debe definir DEV_BYPASS_ACCESS'
            exit 1
          fi
          git check-ignore -q worker/.dev.vars

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: mkdir -p ../dist && npx wrangler deploy --dry-run --env="" --outdir /tmp/rutina-worker
        working-directory: worker

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm run export:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config e2e/playwright.config.ts
