name = "rutina"
main = "src/index.ts"
compatibility_date = "2026-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[placement]
mode = "smart"

[observability]
enabled = true

# Placeholders. Zero Trust todavía se está activando.
# Reemplazá el dominio del equipo y el AUD antes de publicar.
[vars]
ACCESS_TEAM_DOMAIN = "https://pending.cloudflareaccess.com"
ACCESS_AUD = "pending-access-aud"

[[d1_databases]]
binding = "DB"
database_name = "rutina-db"
database_id = "d7d1a017-9a0e-4094-b446-30ec0e0e0a3a"
migrations_dir = "migrations"
