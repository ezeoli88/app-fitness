name = "rutina"
main = "src/index.ts"
compatibility_date = "2026-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[placement]
mode = "smart"

[observability]
enabled = true

# El equipo y el AUD son públicos en el JWT. El email del dueño va por secreto.
[vars]
ACCESS_TEAM_DOMAIN = "https://example.cloudflareaccess.com"
ACCESS_AUD = "replace-with-access-aud-tag"

[[d1_databases]]
binding = "DB"
database_name = "rutina-db"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[env.preview]
name = "rutina-preview"
workers_dev = true
preview_urls = false

[env.preview.vars]
ACCESS_TEAM_DOMAIN = "https://example.cloudflareaccess.com"
ACCESS_AUD = "replace-with-access-aud-tag"

[env.preview.placement]
mode = "smart"

[env.preview.observability]
enabled = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "rutina-db-preview"
database_id = "00000000-0000-4000-8000-000000000002"
migrations_dir = "migrations"

[env.preview.assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]
